name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  linux-selftest:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PrismFS
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libgl-dev libglfw3-dev fonts-dejavu-core

      - name: Configure & Build prismfs_selftest
        run: |
          cmake --preset linux-dev
          cmake --build --preset linux-dev --target prismfs_selftest

      - name: Run prismfs_selftest
        run: ./build/linux-dev/bin/prismfs_selftest
